server:
  port: 8080
spring:
  datasource:
    url: ${HIS_DB_URL:jdbc:mysql://localhost:3306/his_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
    username: ${HIS_DB_USER:his_user}
    password: ${HIS_DB_PASSWORD:his@2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  jackson:
    serialization:
      write-dates-as-timestamps: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/neonatal-schema.sql
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
neonatal:
  source-file: ${NEONATAL_SOURCE:../2024带孕周的出院小结汇总.xlsx}
  import-on-start: ${NEONATAL_IMPORT_ON_START:true}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
