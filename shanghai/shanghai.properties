# 上海地区 Synthea 运行配置
# ===========================================================================
# 用法：
#     run_synthea.bat -c <本文件> -d modules -m "sh_*" -p 100 -s 12345 上海市
#
# 本文件由 shanghai/_build_properties.py 生成，请勿手工编辑。
#
# 注意这是**覆盖层**：Java 侧 Config 的静态初始化先读 classpath 上的
# synthea.properties，之后 App.java:144 再调 Config.load(File) 覆盖同名键。
# 因此这里只列与默认值不同的项。
#
# 值里的中文写成 \uXXXX 转义 —— Config.load 用 FileReader 按平台默认字符集
# 解码，原样写中文在非 UTF-8 平台上会读成乱码。注释不转义。
# ===========================================================================


# ---- 地理：把 Synthea 的美国人口/邮编/时区/SDoH 表换成上海的表 -------------------------------
generate.demographics.default_file = F:/deeplearningPython/HISdata/shanghai/demographics.csv
generate.geography.zipcodes.default_file = F:/deeplearningPython/HISdata/shanghai/zipcodes.csv
generate.geography.timezones.default_file = F:/deeplearningPython/HISdata/shanghai/timezones.csv
generate.geography.sdoh.default_file = F:/deeplearningPython/HISdata/shanghai/sdoh.csv
generate.geography.foreign.birthplace.default_file = F:/deeplearningPython/HISdata/shanghai/foreign_birthplace.json
generate.geography.country_code = CN

# ---- 姓名与语言：需要先跑 shanghai/patches/apply_patches.py ------------------------
generate.names.overlay_file = F:/deeplearningPython/HISdata/shanghai/names_zh.yml
generate.names.chinese = true
generate.demographics.language.override = chinese
generate.append_numbers_to_person_names = false
generate.middle_names = 0.0
generate.lifecycle.phone.format = cn
generate.address.city_prefix = \u4e0a\u6d77\u5e02

# ---- 提供者：上海医疗机构 ----------------------------------------------------------
generate.providers.hospitals.default_file = F:/deeplearningPython/HISdata/shanghai/providers/hospitals.csv
generate.providers.primarycare.default_file = F:/deeplearningPython/HISdata/shanghai/providers/primary_care_facilities.csv
generate.providers.urgentcare.default_file = F:/deeplearningPython/HISdata/shanghai/providers/urgent_care_facilities.csv
generate.providers.veterans.default_file = F:/deeplearningPython/HISdata/shanghai/providers/va_facilities.csv
generate.providers.ihs.hospitals.default_file =
# ↑ 置空 = 跳过这类机构（Synthea 对 optional 项的行为）
generate.providers.ihs.primarycare.default_file =
# ↑ 置空 = 跳过这类机构（Synthea 对 optional 项的行为）
generate.providers.homehealth.default_file =
# ↑ 置空 = 跳过这类机构（Synthea 对 optional 项的行为）
generate.providers.hospice.default_file =
# ↑ 置空 = 跳过这类机构（Synthea 对 optional 项的行为）
generate.providers.nursing.default_file =
# ↑ 置空 = 跳过这类机构（Synthea 对 optional 项的行为）

# ---- 支付方：上海基本医保 ----------------------------------------------------------
generate.payers.insurance_companies.default_file = F:/deeplearningPython/HISdata/shanghai/payers/insurance_companies.csv
generate.payers.insurance_plans.default_file = F:/deeplearningPython/HISdata/shanghai/payers/insurance_plans.csv
generate.payers.insurance_plans.eligibilities_file = F:/deeplearningPython/HISdata/shanghai/payers/insurance_eligibilities.csv
generate.payers.insurance_companies.medicare = \u4e0a\u6d77\u5e02\u57ce\u9547\u804c\u5de5\u57fa\u672c\u533b\u7597\u4fdd\u9669\u57fa\u91d1
generate.payers.insurance_companies.medicaid = \u4e0a\u6d77\u5e02\u57ce\u4e61\u5c45\u6c11\u57fa\u672c\u533b\u7597\u4fdd\u9669\u57fa\u91d1
generate.payers.insurance_companies.dual_eligible = \u4e0a\u6d77\u5e02\u57ce\u9547\u804c\u5de5\u57fa\u672c\u533b\u7597\u4fdd\u9669\u57fa\u91d1
generate.payers.selection_behavior = priority

# ---- 费用：中国医疗服务价格口径 -------------------------------------------------------
# 这几个数是**约定的量级**，不是实测价格，取值理由记在 shanghai/SOURCES.md。
#
# default_medication_cost 是「一张处方的总额」—— Synthea 按 Medication 条目
# 计价（Costs.determineCostOfEntry），而它按 CODE 查的 costs/medications.csv
# 是 RxNorm 码（312617 这种），我们的模块写的是 ATC 码（A10BA02），
# **一个都匹配不上**，所以每条处方都落到这个默认值。想让药费有药间差异，
# 得往 Synthea 的资源文件 costs/medications.csv 里追加 ATC 行 ——
# 那是改 Synthea 安装目录，本轮不做，局限记在 SOURCES.md。
generate.costs.default_encounter_cost = 25.00
generate.costs.default_procedure_cost = 120.00
generate.costs.default_medication_cost = 45.00
generate.costs.default_lab_cost = 30.00
generate.costs.default_immunization_cost = 0.00
generate.costs.default_device_cost = 0.00
generate.costs.default_supply_cost = 0.00

# ---- 导出 ------------------------------------------------------------------
exporter.fhir.export = true
exporter.fhir.use_us_core_ig = false
exporter.fhir.transaction_bundle = true
exporter.encoding = UTF-8
exporter.csv.export = false
