    # 规格与给药途径。FHIR 的 MedicationRequest 里没有这两个位置
    # （FhirR4 只读 as_needed / dosage / instructions / refills），
    # 所以它们属于药品字典 —— 导出层从这张表回填 医嘱_药品.规格 / .给药途径。
    spec_zh: 0.5g
    route_zh: 口服
    # 结构化用法用量。Synthea 的 prescription.dosage 要求这四个键齐全，
    # 缺一个 FhirR4 就 NPE（见 registry.Dosage 的说明）。
    default_dosage:
      amount: 1          # 每次 1 个最小给药单位
      frequency: 2     # 每日2次
      period: 1
      unit: days
    source: 《中国2型糖尿病防治指南(2020年版)》二甲双胍为一线首选

