# 药品白名单。key 是 IR 里 `drug:` 用的键名。
#
# 药品通用名用《中国药品通用名称》规范名。
# atc 为 WHO ATC/DDD Index 码，公开可信。
# ypid 一律留空 —— YPID 码表（WS/T 778-2021）未获取，不编造。
# 填上 ypid 后编译器会自动用 YPID 体系，否则用 ATC。

medications:

  metformin:
    name_zh: 二甲双胍
    name_en: Metformin
    atc: A10BA02
    ypid: null
