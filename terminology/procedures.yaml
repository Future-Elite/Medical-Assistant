    icd9cm3: null
    source: 《中国2型糖尿病防治指南(2020年版)》

  ankle_brachial_index:
    name_zh: 踝肱指数测定
    name_en: Ankle-brachial index measurement
    icd9cm3: null
    source: 《中国2型糖尿病防治指南(2020年版)》下肢血管病变筛查

  oral_glucose_tolerance_test:
    name_zh: 口服葡萄糖耐量试验
    name_en: Oral glucose tolerance test
    icd9cm3: null
    source: 《中国2型糖尿病防治指南(2020年版)》

  hemodialysis:
