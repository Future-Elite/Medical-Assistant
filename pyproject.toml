[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ehrworld-api"
version = "0.1.0"
description = "Python reproduction of EHRWorld's data, simulation and evaluation pipeline using an external LLM"
requires-python = ">=3.10"
dependencies = ["openai>=1.30,<4", "pydantic>=2.7,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
analysis = ["matplotlib>=3.8,<4"]
rl-data = ["openpyxl>=3.1,<4", "pyarrow>=16,<24"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "openpyxl>=3.1,<4", "scikit-learn>=1.6,<1.7", "joblib>=1.4,<2"]

[project.scripts]
ehrworld = "ehrworld.cli:main"

[tool.setuptools.packages.find]
include = ["ehrworld*", "ehrdreamer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
